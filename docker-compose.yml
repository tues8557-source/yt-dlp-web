services:
  yt-dlp-web:
    image: tues8557/yt-dlp-web:latest
    container_name: yt-dlp
    pull_policy: always

    # Synology user UID:GID. Change this for your NAS account.
    # Check it over SSH with: id <username>
    user: "1026:100"

    environment:
      - TZ=Asia/Seoul

      # Uncomment and replace these values to enable web authentication.
      # - AUTH_SECRET=random string of at least 40 characters
      # - CREDENTIAL_USERNAME=your username
      # - CREDENTIAL_PASSWORD=your strong password
      # - API_TOKEN=random string for the automation API

    ports:
      - "3000:3000"

    volumes:
      - /volume1/docker/yt-dlp-web/downloads:/downloads
      - /volume1/docker/yt-dlp-web/cache:/cache

    init: true
    restart: unless-stopped
    stop_grace_period: 1m
